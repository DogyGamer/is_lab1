<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Транспортные средства</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav th:fragment="menu" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Транспорт</span>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/}">Список</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/create}">Создать</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/view}">Поиск по ID</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/special}">Спецоперации</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/coordinates}">Координаты</a></li>
        </ul>
    </div>
</nav>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/vehicle-form.js}"></script>
</th:block>

<th:block th:fragment="vehicleFields">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label" for="name">Название</label>
            <input id="name" class="form-control" required maxlength="255">
        </div>
        <div class="col-md-6">
            <label class="form-label" for="type">Тип</label>
            <select id="type" class="form-select" required>
                <option value="">Выберите тип</option>
                <option th:each="t : ${vehicleTypes}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="enginePower">Мощность двигателя (&gt; 0)</label>
            <input id="enginePower" type="number" step="any" min="0" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="numberOfWheels">Количество колёс (&gt; 0)</label>
            <input id="numberOfWheels" type="number" step="1" min="1" max="2147483647" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="capacity">Вместимость (&gt; 0)</label>
            <input id="capacity" type="number" step="1" min="1" max="2147483647" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="distanceTravelled">Пройденное расстояние (&gt; 0)</label>
            <input id="distanceTravelled" type="number" step="any" min="0" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="fuelConsumption">Расход топлива (&gt; 0, необязательно)</label>
            <input id="fuelConsumption" type="number" step="any" min="0" class="form-control">
        </div>
        <div class="col-md-4">
            <label class="form-label" for="fuelType">Тип топлива (необязательно)</label>
            <select id="fuelType" class="form-select">
                <option value="">Не указан</option>
                <option th:each="f : ${fuelTypes}" th:value="${f}" th:text="${f}"></option>
            </select>
        </div>
        <div class="col-12">
            <label class="form-label" for="coordinatesId">Координаты</label>
            <select id="coordinatesId" class="form-select" onchange="toggleCoordinates()"></select>
        </div>
        <div id="newCoordinates" class="col-12">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="x">X (&gt; -648)</label>
                    <input id="x" type="number" step="any" min="-648" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="y">Y</label>
                    <input id="y" type="number" step="any" class="form-control" required>
                </div>
            </div>
        </div>
    </div>
</th:block>

<div th:fragment="editModal" class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="vehicleForm">
                <div class="modal-header">
                    <h5 class="modal-title">Изменение транспортного средства</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="formErrors" class="alert alert-danger d-none"></div>
                    <th:block th:replace="~{fragments :: vehicleFields}"></th:block>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
