<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Транспортные средства')}"></head>
<body>
<nav th:replace="~{fragments :: menu}"></nav>

<div class="container-fluid px-4">
    <h1 class="h3 mb-3">Транспортные средства</h1>

    <form id="filterForm" class="row g-2 mb-3" autocomplete="off">
        <div class="col-md-3">
            <input id="filterName" class="form-control" placeholder="Название (точное совпадение)">
        </div>
        <div class="col-md-3">
            <select id="filterType" class="form-select">
                <option value="">Любой тип</option>
                <option th:each="t : ${vehicleTypes}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <select id="filterFuelType" class="form-select">
                <option value="">Любой тип топлива</option>
                <option th:each="f : ${fuelTypes}" th:value="${f}" th:text="${f}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-primary">Применить</button>
            <button type="button" id="resetFilter" class="btn btn-outline-secondary">Сбросить</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th data-sort="id" role="button">ID</th>
                <th data-sort="name" role="button">Название</th>
                <th>Координаты</th>
                <th data-sort="creationDate" role="button">Дата создания</th>
                <th data-sort="type" role="button">Тип</th>
                <th data-sort="enginePower" role="button">Мощность</th>
                <th data-sort="numberOfWheels" role="button">Колёса</th>
                <th data-sort="capacity" role="button">Вместимость</th>
                <th data-sort="distanceTravelled" role="button">Расстояние</th>
                <th data-sort="fuelConsumption" role="button">Расход топлива</th>
                <th data-sort="fuelType" role="button">Топливо</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="d-flex align-items-center gap-3 mb-4">
        <button id="prevPage" type="button" class="btn btn-outline-primary">Назад</button>
        <span id="pageInfo"></span>
        <button id="nextPage" type="button" class="btn btn-outline-primary">Вперёд</button>
    </div>
</div>

<div th:replace="~{fragments :: editModal}"></div>

<th:block th:replace="~{fragments :: scripts}"></th:block>
<script th:src="@{/js/index.js}"></script>
</body>
</html>
